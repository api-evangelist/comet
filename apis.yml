aid: comet
name: Comet
description: 'Comet is an enterprise AI/ML developer platform used by over 150,000 developers
  and organizations including Netflix, Uber, and Autodesk. Its flagship open-source product,
  Opik, is an LLM observability, evaluation, and optimization suite for building, testing,
  and monitoring generative AI applications, RAG systems, and agentic workflows — with tracing,
  automated LLM-as-a-judge and heuristic evaluations, prompt management and optimization, and
  production dashboards. Comet also provides classic MLOps tooling for experiment management,
  model registry, artifacts, and production monitoring. Opik exposes a full REST API, Python and
  TypeScript SDKs, a CLI, and an official Model Context Protocol (MCP) server, and runs on Comet
  Cloud, self-hosted (Docker/Kubernetes), or enterprise deployments. Sector: ai-enterprise-software.'
