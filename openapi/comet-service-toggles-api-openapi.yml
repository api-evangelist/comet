openapi: 3.2.0
info:
  title: Opik REST Service Toggles API
  description: The Opik REST API is currently in beta and subject to change.
  contact:
    name: Github Repository
    url: https://github.com/comet-ml/opik
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: http://localhost:5173/api
  description: Local server
- url: https://www.comet.com/opik/api
  description: Opik Cloud
tags:
- name: Service Toggles
  description: Service Toggles resources
paths:
  /v1/private/toggles:
    get:
      tags:
      - Service Toggles
      summary: Get Service Toggles
      operationId: getServiceToggles
      responses:
        '200':
          description: Service Toggles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceTogglesConfig'
components:
  schemas:
    ServiceTogglesConfig:
      required:
      - agentInsightsEnabled
      - agenticToolsEnabled
      - alertsEnabled
      - anthropicProviderEnabled
      - bedrockProviderEnabled
      - costIntelligenceEnabled
      - customllmProviderEnabled
      - datasetExportEnabled
      - datasetVersioningEnabled
      - demoDataEnabled
      - exportEnabled
      - forceWorkspaceVersion
      - geminiProviderEnabled
      - guardrailsEnabled
      - ollamaProviderEnabled
      - ollieEnabled
      - onlineScoringTracingEnabled
      - openaiProviderEnabled
      - openrouterProviderEnabled
      - opikAIEnabled
      - projectHomepageEnabled
      - pythonEvaluatorEnabled
      - spanLlmAsJudgeEnabled
      - spanUserDefinedMetricPythonEnabled
      - traceThreadPythonEvaluatorEnabled
      - v1WorkspaceAllowlistIds
      - v2WorkspaceAllowlistIds
      - vertexaiProviderEnabled
      - welcomeWizardEnabled
      type: object
      properties:
        pythonEvaluatorEnabled:
          type: boolean
        traceThreadPythonEvaluatorEnabled:
          type: boolean
        spanLlmAsJudgeEnabled:
          type: boolean
        spanUserDefinedMetricPythonEnabled:
          type: boolean
        guardrailsEnabled:
          type: boolean
        opikAIEnabled:
          type: boolean
        alertsEnabled:
          type: boolean
        welcomeWizardEnabled:
          type: boolean
        exportEnabled:
          type: boolean
        costIntelligenceEnabled:
          type: boolean
        datasetVersioningEnabled:
          type: boolean
        datasetExportEnabled:
          type: boolean
        demoDataEnabled:
          type: boolean
        openaiProviderEnabled:
          type: boolean
        anthropicProviderEnabled:
          type: boolean
        geminiProviderEnabled:
          type: boolean
        openrouterProviderEnabled:
          type: boolean
        vertexaiProviderEnabled:
          type: boolean
        bedrockProviderEnabled:
          type: boolean
        customllmProviderEnabled:
          type: boolean
        ollamaProviderEnabled:
          type: boolean
        ollieEnabled:
          type: boolean
        projectHomepageEnabled:
          type: boolean
        agenticToolsEnabled:
          type: boolean
        agentInsightsEnabled:
          type: boolean
        onlineScoringTracingEnabled:
          type: boolean
        v2WorkspaceAllowlistIds:
          uniqueItems: true
          type: array
          items:
            minLength: 1
            type: string
        v1WorkspaceAllowlistIds:
          uniqueItems: true
          type: array
          items:
            minLength: 1
            type: string
        forceWorkspaceVersion:
          minLength: 1
          type: string
        defaultPageSize:
          maximum: 100
          minimum: 5
          type: integer
          format: int32
        v2WorkspaceAllowlist:
          type: string
          writeOnly: true
        v1WorkspaceAllowlist:
          type: string
          writeOnly: true
