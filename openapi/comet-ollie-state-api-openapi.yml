openapi: 3.2.0
info:
  title: Opik REST Ollie State API
  description: The Opik REST API is currently in beta and subject to change.
  contact:
    name: Github Repository
    url: https://github.com/comet-ml/opik
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: http://localhost:5173/api
  description: Local server
- url: https://www.comet.com/opik/api
  description: Opik Cloud
tags:
- name: Ollie State
  description: Ollie pod state persistence
paths:
  /v1/private/ollie/state:
    get:
      tags:
      - Ollie State
      summary: Download ollie state
      description: Download stored ollie state file
      operationId: downloadOllieState
      responses:
        '200':
          description: Ollie state file
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
          content:
            application/gzip:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: Not found
          content:
            application/gzip:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
    put:
      tags:
      - Ollie State
      summary: Replace ollie state
      description: Upload gzip-compressed SQLite DB file, replacing any existing state
      operationId: replaceOllieState
      parameters:
      - name: Content-Length
        in: header
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/gzip:
            schema:
              type: object
      responses:
        '204':
          description: No content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
    delete:
      tags:
      - Ollie State
      summary: Delete ollie state
      description: Clear stored ollie state
      operationId: deleteOllieState
      responses:
        '204':
          description: No content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
components:
  schemas:
    ErrorMessage:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: string
