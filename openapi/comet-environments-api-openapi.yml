openapi: 3.2.0
info:
  title: Opik REST Environments API
  description: The Opik REST API is currently in beta and subject to change.
  contact:
    name: Github Repository
    url: https://github.com/comet-ml/opik
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: http://localhost:5173/api
  description: Local server
- url: https://www.comet.com/opik/api
  description: Opik Cloud
tags:
- name: Environments
  description: Environment related resources
paths:
  /v1/private/environments:
    get:
      tags:
      - Environments
      summary: Find environments
      description: Find environments for the workspace. Capped at the workspace limit (default 20).
      operationId: findEnvironments
      responses:
        '200':
          description: Environments page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentPage_Public'
    post:
      tags:
      - Environments
      summary: Create environment
      operationId: createEnvironment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Environment_Write'
      responses:
        '201':
          description: Created
          headers:
            Location:
              required: true
              style: simple
              schema:
                type: string
              example: ${basePath}/v1/private/environments/{environmentId}
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /v1/private/environments/delete:
    post:
      tags:
      - Environments
      summary: Delete environments
      description: Delete environments batch. Idempotent — missing ids are silently ignored.
      operationId: deleteEnvironmentsBatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDelete'
      responses:
        '204':
          description: No Content
  /v1/private/environments/{id}:
    get:
      tags:
      - Environments
      summary: Get environment by id
      operationId: getEnvironmentById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment_Public'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage_Public'
    patch:
      tags:
      - Environments
      summary: Update environment by id
      operationId: updateEnvironment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentUpdate'
      responses:
        '204':
          description: No Content
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
components:
  schemas:
    ErrorMessage:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: string
    ErrorMessage_Public:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: string
    Environment_Public:
      required:
      - name
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          maxLength: 150
          minLength: 0
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        description:
          maxLength: 500
          minLength: 0
          type: string
        color:
          maxLength: 20
          minLength: 0
          type: string
        position:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          readOnly: true
        last_updated_at:
          type: string
          format: date-time
          readOnly: true
        last_updated_by:
          type: string
          readOnly: true
    BatchDelete:
      required:
      - ids
      type: object
      properties:
        ids:
          maxItems: 1000
          minItems: 1
          uniqueItems: true
          type: array
          items:
            type: string
            format: uuid
    Environment_Write:
      required:
      - name
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          maxLength: 150
          minLength: 0
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        description:
          maxLength: 500
          minLength: 0
          type: string
        color:
          maxLength: 20
          minLength: 0
          type: string
        position:
          type: integer
          format: int32
    EnvironmentUpdate:
      type: object
      properties:
        name:
          maxLength: 150
          minLength: 0
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        description:
          maxLength: 500
          minLength: 0
          type: string
        color:
          maxLength: 20
          minLength: 0
          type: string
        position:
          type: integer
          format: int32
    EnvironmentPage_Public:
      type: object
      properties:
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        content:
          type: array
          items:
            $ref: '#/components/schemas/Environment_Public'
        sortableBy:
          type: array
          items:
            type: string
