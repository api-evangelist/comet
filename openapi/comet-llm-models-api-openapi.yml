openapi: 3.2.0
info:
  title: Opik REST LLM Models API
  description: The Opik REST API is currently in beta and subject to change.
  contact:
    name: Github Repository
    url: https://github.com/comet-ml/opik
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: http://localhost:5173/api
  description: Local server
- url: https://www.comet.com/opik/api
  description: Opik Cloud
tags:
- name: LLM Models
  description: LLM model registry resources
paths:
  /v1/private/llm/models:
    get:
      tags:
      - LLM Models
      summary: Get LLM models
      description: Get the list of supported LLM models grouped by provider
      operationId: getLlmModels
      responses:
        '200':
          description: LLM models by provider
          content:
            application/json:
              schema:
                type: string
