openapi: 3.2.0
info:
  title: Opik REST Report Failures API
  description: The Opik REST API is currently in beta and subject to change.
  contact:
    name: Github Repository
    url: https://github.com/comet-ml/opik
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: http://localhost:5173/api
  description: Local server
- url: https://www.comet.com/opik/api
  description: Opik Cloud
tags:
- name: Report Failures
  description: Generic failure log for reports/jobs
paths:
  /v1/private/report-failures:
    get:
      tags:
      - Report Failures
      summary: List failures for a project
      description: Returns failures for the given project id and type, most recent first.
      operationId: findReportFailures
      parameters:
      - name: type
        in: query
        required: true
        schema:
          type: string
          enum:
          - agent_insights
      - name: project_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 1
      - name: size
        in: query
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: Failures page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportFailurePage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
    post:
      tags:
      - Report Failures
      summary: Record a report/job failure
      description: Appends a failure row keyed by (project_id, type). Append-only — never overwrites earlier failures.
      operationId: createReportFailure
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportFailure'
      responses:
        '201':
          description: Created
          headers:
            Location:
              style: simple
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
components:
  schemas:
    ErrorMessage:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: string
    ReportFailurePage:
      type: object
      properties:
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        content:
          type: array
          items:
            $ref: '#/components/schemas/ReportFailure'
    ReportFailure:
      required:
      - project_id
      - reason
      - type
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          type: string
          enum:
          - agent_insights
        project_id:
          type: string
          format: uuid
        reason:
          maxLength: 255
          minLength: 0
          type: string
        detail:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          readOnly: true
        last_updated_at:
          type: string
          format: date-time
          readOnly: true
        last_updated_by:
          type: string
          readOnly: true
