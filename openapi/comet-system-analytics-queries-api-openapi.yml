openapi: 3.2.0
info:
  title: Opik REST System analytics queries API
  description: The Opik REST API is currently in beta and subject to change.
  contact:
    name: Github Repository
    url: https://github.com/comet-ml/opik
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: http://localhost:5173/api
  description: Local server
- url: https://www.comet.com/opik/api
  description: Opik Cloud
tags:
- name: System analytics queries
  description: Internal endpoint to run Agent Insights free-form SQL
paths:
  /v1/internal/analytics-queries/projects/{projectId}:
    post:
      tags:
      - System analytics queries
      summary: Execute Agent Insights free-form SQL
      description: Runs Ollie-generated read-only SQL bounded to the caller's workspace and the requested project. Returns 501 when the Agent Insights toggle is off.
      operationId: executeAnalyticsQuery
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsQueryRequest'
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsQueryResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '501':
          description: Agent Insights queries are not enabled
components:
  schemas:
    AnalyticsQueryResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/JsonNode'
    JsonNode:
      type: object
    ErrorMessage:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: string
    AnalyticsQueryRequest:
      required:
      - query
      type: object
      properties:
        query:
          minLength: 1
          type: string
          description: Read-only ClickHouse SQL. Must return exactly one column named `result` produced via toJSONString(...)
