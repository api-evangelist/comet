openapi: 3.2.0
info:
  title: Opik REST OpenTelemetry Ingestion API
  description: The Opik REST API is currently in beta and subject to change.
  contact:
    name: Github Repository
    url: https://github.com/comet-ml/opik
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: http://localhost:5173/api
  description: Local server
- url: https://www.comet.com/opik/api
  description: Opik Cloud
tags:
- name: OpenTelemetry Ingestion
  description: Resource to ingest Traces and Spans via OpenTelemetry
paths:
  /v1/private/otel/v1/traces:
    post:
      tags:
      - OpenTelemetry Ingestion
      operationId: receiveProtobufTraces
      requestBody:
        content:
          application/x-protobuf:
            schema:
              $ref: '#/components/schemas/JsonNode'
      responses:
        default:
          description: default response
          content:
            '*/*': {}
      summary: Receive protobuf traces
      x-summary-source: derived
components:
  schemas:
    JsonNode:
      type: object
